name: Consultar mains del corte publicado
on:
  workflow_dispatch:
    inputs:
      capture_run_id:
        description: Ejecución semanal que contiene la captura del corte publicado
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: smash-gt-publication
  cancel-in-progress: false
env:
  SMASH_PUBLIC_URL: ${{ vars.SMASH_PUBLIC_URL || 'https://ingporras.com/ranking-smash-ultimate' }}
  SMASH_FTP_DIR: ${{ vars.SMASH_FTP_DIR }}
jobs:
  characters:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recuperar captura y corte público coincidentes
        env:
          GH_TOKEN: ${{ github.token }}
          CAPTURE_RUN: ${{ inputs.capture_run_id }}
        run: |
          [[ "$CAPTURE_RUN" =~ ^[0-9]+$ ]] || exit 1
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CAPTURE_RUN" --jq '.path == ".github/workflows/smash-publish.yml" and .head_branch == "main"' | grep -qx true
          gh run download "$CAPTURE_RUN" --repo "$GITHUB_REPOSITORY" --name smash-gt-capturas --dir scripts/smash/data
          curl -fsS --max-time 30 "$SMASH_PUBLIC_URL/data/public.json" -o scripts/smash/data/characters-before.json
      - uses: actions/cache/restore@v4
        with:
          path: scripts/smash/data/characters-cache.json
          key: smash-characters-v1-${{ github.run_id }}
          restore-keys: smash-characters-v1-
      - name: Consultar selecciones reales por game
        env:
          STARTGG_TOKEN: ${{ secrets.STARTGG_TOKEN }}
        run: python scripts/smash/characters.py scripts/smash/data/combined.json scripts/smash/data/characters-before.json --output-public scripts/smash/data/public-mains.json --output-snapshot scripts/smash/data/combined-mains.json
      - name: Validar resultado
        run: |
          PYTHONPATH=scripts/smash python -c 'import json; from deploy import validate_public_data; validate_public_data(json.load(open("scripts/smash/data/public-mains.json")))'
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: scripts/smash/data/characters-cache.json
          key: smash-characters-v1-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        with:
          name: smash-mains
          path: |
            scripts/smash/data/public-mains.json
            scripts/smash/data/combined-mains.json
          retention-days: 14
