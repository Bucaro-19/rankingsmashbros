name: Comprobar dueños de torneos en start.gg
# SONDA de un solo uso, solo lectura, rama probe/: no fusionar. Simulación del complemento de cobertura.
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Simulación de recuperación sobre la captura del 1/nov (sin FTP, SQL ni publicación)
        env:
          STARTGG_TOKEN: ${{ secrets.STARTGG_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: scripts/smash
        run: |
          mkdir -p sim
          gh run download 41307127512 --repo "$GITHUB_REPOSITORY" --name smash-gt-capturas --dir sim
          python scripts/smash/fetch_tts.py
          python scripts/smash/simulate_coverage.py sim/national.json sim/abroad.json --curation scripts/smash/curation.json \
            --points-csv scripts/smash/data/ultrank_players.csv --watch 5551493
          rm -rf sim
