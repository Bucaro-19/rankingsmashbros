name: Comprobar dueños de torneos en start.gg
# Consulta de un solo uso, solo lectura. Imprime conteos agregados, sin identificadores.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: smash-gt-publication
  cancel-in-progress: false
jobs:
  probe:
    if: github.ref == 'refs/heads/feat/organizer-small-events'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probar la consulta de dueños que usa la captura semanal
        env:
          STARTGG_TOKEN: ${{ secrets.STARTGG_TOKEN }}
        run: python scripts/smash/organizer_small.py --probe --start 2026-01-01 --end 2026-10-09 --limit 2
