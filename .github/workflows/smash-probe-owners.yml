name: Comprobar dueños de torneos en start.gg
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Historial público acotado, solo lectura, sin importación
        env:
          STARTGG_TOKEN: ${{ secrets.STARTGG_TOKEN }}
          PYTHONPATH: scripts/smash
        run: |
          python - <<'PROBE'
          import os,json
          from collect import Client,PROFILE,SETS
          c=Client(os.environ['STARTGG_TOKEN'])
          q="""query { a:tournament(id:957669){id name slug countryCode startAt endAt isOnline events(limit:30){id name numEntrants type state startAt isOnline videogame{id name}}} b:tournament(id:948197){id name slug countryCode startAt endAt isOnline events(limit:30){id name numEntrants type state startAt isOnline videogame{id name}}} c:tournament(id:947356){id name slug countryCode startAt endAt isOnline events(limit:30){id name numEntrants type state startAt isOnline videogame{id name}}} }"""
          print(json.dumps({'requests':1,'tournaments':c.query(q,{})},ensure_ascii=False))
          PROBE
