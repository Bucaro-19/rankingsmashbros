name: Comprobar dueños de torneos en start.gg
# Temporary read-only backfill simulation on the task branch; restored before PR delivery.
on:
  workflow_dispatch:
    inputs:
      inventory:
        type: string
        required: true
      public_key:
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: smash-gt-publication
  cancel-in-progress: false
jobs:
  probe:
    if: github.ref == 'refs/heads/feat/small-events-backfill'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Capture bounded batch without SQL or publication
        env:
          STARTGG_TOKEN: ${{ secrets.STARTGG_TOKEN }}
          BACKFILL_INVENTORY: ${{ inputs.inventory }}
          BACKFILL_PUBLIC_KEY: ${{ inputs.public_key }}
        run: |
          umask 077
          mkdir backfill-private
          python - <<'PYINPUT'
          import base64,json,os
          from pathlib import Path
          folder=Path('backfill-private')
          (folder/'inventory.json').write_text(json.dumps(json.loads(os.environ['BACKFILL_INVENTORY'])))
          (folder/'recipient.pub').write_bytes(base64.b64decode(os.environ['BACKFILL_PUBLIC_KEY'],validate=True))
          PYINPUT
          python scripts/database/small_events_backfill.py capture --inventory backfill-private/inventory.json --output backfill-private/batch.json --end 2026-10-10 --limit 6
          # Only ciphertext leaves the runner; the private key stays on the owner's Mac.
          openssl rand -hex 32 > backfill-private/passphrase
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 -pass file:backfill-private/passphrase -in backfill-private/batch.json -out backfill-private/batch.enc
          openssl pkeyutl -encrypt -pubin -inkey backfill-private/recipient.pub -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in backfill-private/passphrase -out backfill-private/key.enc
          rm backfill-private/batch.json backfill-private/passphrase backfill-private/inventory.json backfill-private/recipient.pub
      - uses: actions/upload-artifact@v4
        with:
          name: small-backfill-sealed
          retention-days: 1
          path: |
            backfill-private/batch.enc
            backfill-private/key.enc
