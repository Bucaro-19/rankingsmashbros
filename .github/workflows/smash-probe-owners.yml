name: Comprobar dueños de torneos en start.gg
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: smash-gt-publication
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read-only Legends roster and schema, capped at 30 attempts
        env:
          STARTGG_TOKEN: ${{ secrets.STARTGG_TOKEN }}
          PYTHONPATH: scripts/smash
        run: |
          python - <<'PY'
          import os,json,time
          from collect import Client
          from organizer_small import BudgetClient
          c=Client(os.environ['STARTGG_TOKEN']);b=BudgetClient(c)
          s=b.query('''query{tournament:__type(name:"Tournament"){fields{name args{name type{kind name ofType{kind name}}}}} participant:__type(name:"Participant"){fields{name type{kind name ofType{kind name}}}} filters:__type(name:"SetFilters"){inputFields{name type{kind name ofType{kind name}}}}}''',{})
          open('/tmp/result.json','w').write(json.dumps({'schema':s,'requests':c.calls}));print(json.dumps({'requests':c.calls,'schemaRead':True}))
          PY
      - name: Encrypt to local owner key
        run: |
          echo  | base64 -d > /tmp/cert.pem
          openssl cms -encrypt -binary -aes-256-cbc -in /tmp/result.json -out result.cms -outform DER /tmp/cert.pem
      - uses: actions/upload-artifact@v4
        with:
          name: legends-context-encrypted
          path: result.cms
          retention-days: 1
