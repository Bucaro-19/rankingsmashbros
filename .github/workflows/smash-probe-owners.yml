name: Comprobar dueños de torneos en start.gg
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Historial público acotado, solo lectura, sin importación
        env:
          STARTGG_TOKEN: ${{ secrets.STARTGG_TOKEN }}
          PYTHONPATH: scripts/smash
        run: |
          python - <<'PROBE'
          import os,json
          from collect import Client,PROFILE,SETS
          c=Client(os.environ['STARTGG_TOKEN'])
          q='query { plain:tournaments(query:{perPage:10,filter:{ids:[957669,948197,947356]}}){pageInfo{total}nodes{id}} gt:tournaments(query:{perPage:10,filter:{ids:[957669,948197,947356],countryCode:"GT"}}){pageInfo{total}nodes{id}} game:tournaments(query:{perPage:10,filter:{ids:[957669,948197,947356],videogameIds:[1386]}}){pageInfo{total}nodes{id}} both:tournaments(query:{perPage:10,filter:{ids:[957669,948197,947356],countryCode:"GT",videogameIds:[1386]}}){pageInfo{total}nodes{id}} nonSearchable:tournaments(query:{perPage:10,filter:{ids:[957669,948197,947356],publiclySearchable:false}}){pageInfo{total}nodes{id}} }'
          print(json.dumps({'requests':1,'discovery':c.query(q,{})}))
          PROBE
