name: Comprobar dueños de torneos en start.gg
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Historial público acotado, solo lectura, sin importación
        env:
          STARTGG_TOKEN: ${{ secrets.STARTGG_TOKEN }}
          PYTHONPATH: scripts/smash
        run: |
          python - <<'PROBE'
          import os,json
          from collect import Client,PROFILE,SETS
          c=Client(os.environ['STARTGG_TOKEN'])
          q='query { t:__type(name:"Tournament"){fields{name}} f:__type(name:"TournamentPageFilter"){inputFields{name}} }'
          d=c.query(q,{})
          print(json.dumps({'requests':1,'tournamentFields':[x['name'] for x in (d.get('t') or {}).get('fields') or [] if any(w in x['name'].lower() for w in ('public','search','league','type','publish','state','country'))],'filterFields':[x['name'] for x in (d.get('f') or {}).get('inputFields') or []]}))
          PROBE
