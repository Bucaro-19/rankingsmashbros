name: Comprobar dueños de torneos en start.gg
# SONDA de un solo uso, solo lectura, rama probe/: no fusionar. Máximo 4 consultas.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Búsqueda por organizador de tres torneos verificados, solo lectura
        env:
          STARTGG_TOKEN: ${{ secrets.STARTGG_TOKEN }}
          PYTHONPATH: scripts/smash
        run: |
          python - <<'PROBE'
          import os,json,time
          from collect import Client
          started=time.monotonic(); c=Client(os.environ['STARTGG_TOKEN'])
          ids=[957669,948197,947356]
          q='query{ f:__type(name:"UserTournamentsPaginationFilter"){inputFields{name}} u:user(id:2735916){tournaments(query:{perPage:50,page:1}){pageInfo{total totalPages} nodes{id countryCode startAt}}} }'
          d=c.query(q,{}); conn=((d.get('u') or {}).get('tournaments') or {})
          nodes=conn.get('nodes') or []
          print(json.dumps({'requests':c.calls,'seconds':round(time.monotonic()-started,3),'filterFields':[x['name'] for x in ((d.get('f') or {}).get('inputFields') or [])],'total':(conn.get('pageInfo') or {}).get('total'),'pages':(conn.get('pageInfo') or {}).get('totalPages'),'containsMissing':sorted(n['id'] for n in nodes if n['id'] in ids),'returned':len(nodes)}))
          PROBE
