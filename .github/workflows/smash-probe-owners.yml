name: Comprobar dueños de torneos en start.gg
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Historial público acotado, solo lectura, sin importación
        env:
          STARTGG_TOKEN: ${{ secrets.STARTGG_TOKEN }}
          PYTHONPATH: scripts/smash
        run: |
          python - <<'PROBE'
          import os,json
          from collect import Client,PROFILE,SETS
          c=Client(os.environ['STARTGG_TOKEN'])
          from collections import defaultdict,Counter
          from rank import competitive_set,BAD_SCORE
          conn=(c.query(SETS,{'id':5551493,'page':1}).get('player') or {})['sets'];rows=defaultdict(Counter)
          for m in conn.get('nodes') or []:
              if not any(str((part.get('player') or {}).get('id'))=='5551493' for sl in m.get('slots') or [] for part in (sl.get('entrant') or {}).get('participants') or []):continue
              r=rows[str((m.get('event') or {}).get('id'))];r['sourceSets']+=1
              pair=competitive_set(m);score=m.get('displayScore')
              if pair is not None:
                  r['validWins']+=pair[0]=='5551493';r['validLosses']+=pair[1]=='5551493'
              elif m.get('state')!=3 or m.get('winnerId') is None:r['unfinishedOrNoWinner']+=1
              elif not isinstance(score,str) or not score.strip():r['missingScore']+=1
              elif BAD_SCORE.search(score):r['dqByeWoForfeitScore']+=1
              else:r['otherInvalidShape']+=1
          print(json.dumps({'requests':c.calls,'totalPages':(conn.get('pageInfo') or {}).get('totalPages'),'events':dict(rows)}))
          PROBE
