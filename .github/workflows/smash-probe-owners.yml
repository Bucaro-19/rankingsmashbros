name: Captura privada temporal de backfill pequeño
on:
  workflow_dispatch:
    inputs:
      inventory:
        required: true
        type: string
      public_key:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: smash-gt-publication
  cancel-in-progress: false
jobs:
  probe:
    if: github.ref == 'refs/heads/docs/small-backfill-production'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Capturar con la herramienta fusionada y cifrar para la Mac
        env:
          STARTGG_TOKEN: ${{ secrets.STARTGG_TOKEN }}
          BACKFILL_INVENTORY: ${{ inputs.inventory }}
          BACKFILL_PUBLIC_KEY: ${{ inputs.public_key }}
        run: |
          umask 077
          mkdir backfill-private
          python - <<'PY'
          import os, json, base64
          from pathlib import Path
          p = Path('backfill-private')
          (p/'inventory.json').write_text(json.dumps(json.loads(os.environ['BACKFILL_INVENTORY'])))
          (p/'recipient.pub').write_bytes(base64.b64decode(os.environ['BACKFILL_PUBLIC_KEY'], validate=True))
          PY
          python scripts/database/small_events_backfill.py capture --inventory backfill-private/inventory.json --output backfill-private/batch.json --start 2026-01-01 --end 2026-10-10 --limit 6
          openssl rand -hex 32 > backfill-private/passphrase
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 -pass file:backfill-private/passphrase -in backfill-private/batch.json -out backfill-private/batch.enc
          openssl pkeyutl -encrypt -pubin -inkey backfill-private/recipient.pub -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in backfill-private/passphrase -out backfill-private/key.enc
          rm backfill-private/batch.json backfill-private/passphrase backfill-private/inventory.json backfill-private/recipient.pub
      - uses: actions/upload-artifact@v4
        with:
          name: smash-small-backfill-sealed
          path: |
            backfill-private/batch.enc
            backfill-private/key.enc
          retention-days: 1
          if-no-files-found: error
