name: Comprobar dueños de torneos en start.gg
# Consulta de un solo uso, solo lectura. Imprime conteos agregados, sin identificadores.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    if: github.ref == 'refs/heads/feat/tournament-agenda'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Comprobar esquema vigente de start.gg (agenda, solo lectura)
        env:
          STARTGG_TOKEN: ${{ secrets.STARTGG_TOKEN }}
        run: python scripts/smash/agenda_probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: smash-agenda-schema
          path: scripts/smash/data/agenda-schema.json
          retention-days: 7
