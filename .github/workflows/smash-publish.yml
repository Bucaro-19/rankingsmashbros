name: Actualizar y publicar Smash GT
on:
  workflow_dispatch:
    inputs:
      resume_run_id:
        description: Reanudar desde las capturas de una ejecución de este workflow (opcional)
        required: false
        type: string
  schedule:
    # Pruebas: todos los días a las 06:23 de Guatemala (12:23 UTC).
    - cron: '23 12 * * *'
    # Corte semanal: cada domingo a las 00:00 de Guatemala.
    - cron: '0 0 * * 0'
      timezone: 'America/Guatemala'
permissions:
  contents: read
  actions: read
concurrency:
  group: smash-gt-publication
  cancel-in-progress: false
env:
  SMASH_PUBLIC_URL: ${{ vars.SMASH_PUBLIC_URL || 'https://ingporras.com/ranking-smash-ultimate' }}
  SMASH_FTP_DIR: ${{ vars.SMASH_FTP_DIR }}
jobs:
  publish:
    # Solo main se publica: otra rama podría traer páginas anteriores a la encuesta en SQL.
    if: >-
      github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' ||
      (vars.SMASH_SYNC_ENABLED == 'true' &&
        ((vars.SMASH_RELEASE_MODE == 'testing' && github.event.schedule == '23 12 * * *') ||
         ((vars.SMASH_RELEASE_MODE == 'weekly' || vars.SMASH_RELEASE_MODE == 'production') && github.event.schedule == '0 0 * * 0'))))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Comprobar conexión configurada
        env:
          STARTGG_TOKEN: ${{ secrets.STARTGG_TOKEN }}
        run: |
          if [ -z "$STARTGG_TOKEN" ]; then
            echo 'Falta el secreto STARTGG_TOKEN. No se publicará ningún cambio.'
            exit 1
          fi
      - name: Recuperar capturas de una ejecución revisada
        if: inputs.resume_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SMASH_RESUME_RUN: ${{ inputs.resume_run_id }}
        run: |
          [[ "$SMASH_RESUME_RUN" =~ ^[0-9]+$ ]] || { echo 'ID de ejecución inválido'; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SMASH_RESUME_RUN" --jq '.path == ".github/workflows/smash-publish.yml" and .head_branch == "main"' | grep -qx true
          gh run download "$SMASH_RESUME_RUN" --repo "$GITHUB_REPOSITORY" --name smash-gt-capturas --dir scripts/smash/data
      - name: Verificar recopilación y exportación
        run: python -m unittest discover -s scripts/smash -v
      - name: Descubrir los torneos de Guatemala de la temporada
        if: inputs.resume_run_id == ''
        env:
          STARTGG_TOKEN: ${{ secrets.STARTGG_TOKEN }}
          SMASH_START: ${{ vars.SMASH_START || '2026-01-01' }}
        run: |
          end_date=$(date -u -d tomorrow +%F)
          season_end="$((${SMASH_START%%-*} + 1))-01-01"
          if [[ "$end_date" > "$season_end" ]]; then end_date="$season_end"; fi
          python scripts/smash/discover.py --start "$SMASH_START" --end "$end_date"
      - name: Revisar y descargar torneos internacionales descubiertos
        env:
          STARTGG_TOKEN: ${{ secrets.STARTGG_TOKEN }}
        run: python scripts/smash/discover_abroad.py scripts/smash/data/national.json --curation scripts/smash/curation.json --fetch
      - name: Calcular todos los clasificados y destacar el top 100
        run: |
          python scripts/smash/fetch_tts.py
          python scripts/smash/combine.py scripts/smash/data/national.json scripts/smash/data/abroad.json scripts/smash/data/combined.json
          python scripts/smash/rank.py scripts/smash/data/combined.json scripts/smash/data/pilot-ranking.json --curation scripts/smash/curation.json --points-csv scripts/smash/data/ultrank_players.csv
          if curl -fsS --max-time 20 "$SMASH_PUBLIC_URL/data/public.json" -o scripts/smash/data/previous-public.tmp && python -m json.tool scripts/smash/data/previous-public.tmp > /dev/null; then
            mv scripts/smash/data/previous-public.tmp scripts/smash/data/previous-public.json
          fi
          python scripts/smash/publish_ranking.py scripts/smash/data/combined.json scripts/smash/data/pilot-ranking.json ranking-smash-ultimate/data/public.json --curation scripts/smash/curation.json --previous-public scripts/smash/data/previous-public.json --include-local --points-csv scripts/smash/data/ultrank_players.csv
      - uses: actions/cache/restore@v4
        with:
          path: scripts/smash/data/characters-cache.json
          key: smash-characters-v1-${{ github.run_id }}
          restore-keys: smash-characters-v1-
      - name: Consultar personajes registrados sin cambiar el ranking
        env:
          STARTGG_TOKEN: ${{ secrets.STARTGG_TOKEN }}
        run: python scripts/smash/characters.py scripts/smash/data/combined.json ranking-smash-ultimate/data/public.json --output-public ranking-smash-ultimate/data/public.json
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: scripts/smash/data/characters-cache.json
          key: smash-characters-v1-${{ github.run_id }}
      - name: Auditar cobertura y sensibilidad del corte
        run: python scripts/smash/audit.py scripts/smash/data/combined.json scripts/smash/curation.json scripts/smash/data/auditoria.md --points-csv scripts/smash/data/ultrank_players.csv
      - name: Preparar paquete privado para importar el corte a SQL
        continue-on-error: true
        run: python scripts/database/ranking_package.py scripts/smash/data/combined.json ranking-smash-ultimate/data/public.json scripts/smash/data/database-package.json
      - name: Guardar auditoría para revisión
        uses: actions/upload-artifact@v4
        with:
          name: smash-gt-auditoria
          path: |
            scripts/smash/data/auditoria.md
            ranking-smash-ultimate/data/public.json
          retention-days: 30
      - name: Publicar en la subcarpeta del ranking con FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          SMASH_FEEDBACK_ADMIN_HASH: ${{ secrets.SMASH_FEEDBACK_ADMIN_HASH }}
        run: python scripts/smash/deploy.py
      - name: Guardar capturas privadas para revisar cobertura o reanudar una publicación
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smash-gt-capturas
          path: |
            scripts/smash/data/national.json
            scripts/smash/data/abroad.json
            scripts/smash/data/combined.json
            scripts/smash/data/pilot-ranking.json
            scripts/smash/data/previous-public.json
            scripts/smash/data/database-package.json
          retention-days: 7
          if-no-files-found: ignore
