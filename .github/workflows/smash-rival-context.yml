name: Contexto de análisis de inscritos (Legends 7)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: smash-gt-publication
  cancel-in-progress: false
jobs:
  probe:
    if: github.repository == 'Bucaro-19/rankingsmashbros' && github.ref == 'refs/heads/fix/legends-history-capture'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sonda privada de forma del primer historial ausente, sin escrituras
        env:
          STARTGG_TOKEN: ${{ secrets.STARTGG_TOKEN }}
          SMASH_SQL_SYNC_KEY: ${{ secrets.SMASH_SQL_SYNC_KEY }}
        run: python scripts/database/probe_rival_history.py
