name: Sonda reparto de historiales · solo lectura
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: smash-gt-publication
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inventario de lectura y validación local sin entrega
        env:
          STARTGG_TOKEN: ${{ secrets.STARTGG_TOKEN }}
          SMASH_SQL_SYNC_KEY: ${{ secrets.SMASH_SQL_SYNC_KEY }}
        run: python scripts/database/probe_fair_history.py
