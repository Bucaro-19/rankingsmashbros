name: Contexto de análisis de inscritos (Legends 7)
on:
  workflow_dispatch:
  schedule:
    # Cada seis horas. UTC; minutos separados del cron local de cinco minutos.
    - cron: '37 2,8,14,20 * * *'
permissions:
  contents: read
concurrency:
  group: smash-gt-publication
  cancel-in-progress: false
jobs:
  context:
    # No se activa al añadir el archivo ni desde ramas/forks.
    if: >-
      github.repository == 'Bucaro-19/rankingsmashbros' &&
      github.ref == 'refs/heads/main' && vars.SMASH_RIVAL_SYNC_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Consultar lista y cargar contexto por el canal firmado
        env:
          STARTGG_TOKEN: ${{ secrets.STARTGG_TOKEN }}
          SMASH_SQL_SYNC_KEY: ${{ secrets.SMASH_SQL_SYNC_KEY }}
          SMASH_RIVAL_EVENT_ID: ${{ vars.SMASH_RIVAL_EVENT_ID || '1687524' }}
        run: python scripts/database/rival_automation.py
      # Sin FTP, MySQL, subida de artefactos, caché compartida o cambios en public.json.
