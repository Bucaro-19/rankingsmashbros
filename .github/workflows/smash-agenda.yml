name: Sonda agenda · solo lectura
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: smash-gt-publication
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Comparar filtros de agenda sin personas ni publicación
        env:
          STARTGG_TOKEN: ${{ secrets.STARTGG_TOKEN }}
        run: |
          python - <<'PYTHON'
          import sys,os,json,time
          sys.path.insert(0,'scripts/smash')
          from collect import Client,APIError
          from agenda import QUERY
          c=Client(os.environ['STARTGG_TOKEN'])
          variants=[('agenda_actual',QUERY),('sin_publiclySearchable',QUERY.replace('publiclySearchable:true','')),('sin_upcoming',QUERY.replace('upcoming:true,','')),('sin_videogame',QUERY.replace('videogameIds:[1386],',''))]
          for label,q in variants:
              try:
                  d=c.query(q,{'page':1,'after':int(time.time())})['tournaments']
                  print(json.dumps({'probe':label,'pageInfo':d.get('pageInfo'),'tournaments':[{'id':t['id'],'slug':t['slug'],'countryCode':t['countryCode'],'startAt':t['startAt'],'ultimateEventIds':[e['id'] for e in t.get('events',[])]} for t in d.get('nodes',[])]}))
              except Exception:
                  print(json.dumps({'probe':label,'status':'safe_query_failed'}))
                  raise SystemExit(1)
          q='query{tournament(slug:"smash-2210-1"){id name countryCode startAt endAt timezone events(limit:50,filter:{videogameId:[1386],published:true}){id name startAt videogame{id}}}}'
          try:
              print(json.dumps({'probe':'metadata','tournament':c.query(q,{})['tournament'],'queries':c.calls}))
          except Exception:
              print(json.dumps({'probe':'metadata','status':'safe_query_failed','queries':c.calls}));raise SystemExit(1)
          PYTHON
