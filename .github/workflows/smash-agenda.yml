name: Actualizar agenda de torneos Smash GT
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publicar solo agenda.json (requiere orden del dueño; solo main)
        type: boolean
        default: false
  schedule:
    # Propuesta: diario a las 07:17 Guatemala (13:17 UTC), separado del corte del domingo.
    - cron: '17 13 * * *'
permissions:
  contents: read
concurrency:
  group: smash-gt-publication
  cancel-in-progress: false
jobs:
  agenda:
    # La variable nueva queda desactivada hasta que el dueño autorice la agenda.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.ref == 'refs/heads/main' && vars.SMASH_AGENDA_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sonda de filtros de agenda (solo lectura, sin personas)
        env:
          STARTGG_TOKEN: ${{ secrets.STARTGG_TOKEN }}
        run: |
          python - <<'PROBE'
          import os,sys,json,time
          sys.path.insert(0,'scripts/smash')
          from collect import Client
          c=Client(os.environ['STARTGG_TOKEN'])
          probes=[
              ('known', 'query{tournament(id:966688){id startAt endAt countryCode isRegistrationOpen registrationClosesAt}}'),
              ('upcoming_only','query{tournaments(query:{page:1,perPage:5,sortBy:"startAt asc",filter:{countryCode:"GT",videogameIds:[1386],published:true,publiclySearchable:true,upcoming:true}}){pageInfo{total totalPages} nodes{id startAt registrationClosesAt}}}'),
              ('latest_without_time','query{tournaments(query:{page:1,perPage:5,sortBy:"startAt desc",filter:{countryCode:"GT",videogameIds:[1386],published:true,publiclySearchable:true}}){pageInfo{total totalPages} nodes{id startAt registrationClosesAt}}}')]
          for label,q in probes:
              d=c.query(q,{})
              print(json.dumps({'variant':label,'response':d,'queries':c.calls}))
          PROBE
