name: Verificar Smash GT
on:
  push:
    paths: ['ranking-smash-ultimate/**', 'scripts/smash/**', '.github/workflows/smash-*.yml', 'docs/smash/**', 'scripts/database/**']
  pull_request:
    paths: ['ranking-smash-ultimate/**', 'scripts/smash/**', '.github/workflows/smash-*.yml', 'docs/smash/**', 'scripts/database/**']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verificar importación, exportación y destino de publicación
        run: |
          python -m unittest discover -s scripts/smash -v
          python scripts/database/test_import_ranking.py
      - name: Verificar JavaScript
        run: |
          node --check ranking-smash-ultimate/characters.js
          node --check ranking-smash-ultimate/app.js
          node --check ranking-smash-ultimate/metodologia.js
          node --check ranking-smash-ultimate/analisis-top20.js
          node --test scripts/smash/test_app.cjs
      - name: Verificar PHP en la versión del hosting y en la mínima admitida
        run: |
          # El servidor usa PHP 8.1; el código publicado debe seguir siendo válido desde 7.4.
          docker run --rm -v "$PWD":/app -w /app php:7.4-cli sh -c 'for f in ranking-smash-ultimate/*.php scripts/database/import_survey.php; do php -l "$f" || exit 1; done'
          docker run --rm -v "$PWD":/app -w /app php:8.1-cli sh -c 'for f in ranking-smash-ultimate/*.php scripts/database/*.php; do php -l "$f" || exit 1; done'
      - name: Verificar contratos estáticos de la encuesta
        run: python scripts/database/test_survey_http.py

  database:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ['mariadb:10.11', 'mysql:8.0']
    services:
      database:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: disposable-test-only
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: smash_schema_test
        ports:
          - 33306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install PyMySQL==1.1.2 cryptography==46.0.2
      - name: Install PHP database drivers and UTF-8 support
        run: sudo apt-get update -qq && sudo apt-get install -y -qq php-cli php-mysql php-sqlite3 php-mbstring
      - name: Verify catalog seed matches UI
        run: node scripts/database/build_character_seed.cjs --check
      - name: Install schema twice and test competition workflows
        env:
          SMASH_SCHEMA_TEST_DB: smash_schema_test
          SMASH_SCHEMA_TEST_PORT: '33306'
          SMASH_SCHEMA_TEST_PASSWORD: disposable-test-only
        run: |
          for file in ranking-smash-ultimate/*.php scripts/database/*.php; do php -l "$file"; done
          python scripts/database/test_schema.py
          php scripts/database/test_connection.php
          python scripts/database/test_diagnostic_http.py
          python scripts/database/test_import_ranking.py
          php scripts/database/test_import_survey.php
          php scripts/database/test_survey_storage.php
          python scripts/database/test_survey_http.py
