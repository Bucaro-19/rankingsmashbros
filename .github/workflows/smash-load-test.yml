name: Verificar guion de carga controlada
on:
  push:
    paths: ['scripts/loadtest/**', '.github/workflows/smash-load-test.yml']
  pull_request:
    paths: ['scripts/loadtest/**', '.github/workflows/smash-load-test.yml']
permissions:
  contents: read
jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probar topes, frenos, ventanas y HTTP local sin producción
        run: python -m unittest discover -s scripts/loadtest -v
