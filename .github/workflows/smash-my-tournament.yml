name: Mi torneo · bracket privado
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: smash-gt-publication
  cancel-in-progress: false
jobs:
  bracket:
    if: github.ref == 'refs/heads/fix/my-tournament-source-query'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Capturar y guardar bracket privado por receptor firmado
        env:
          STARTGG_TOKEN: ${{ secrets.STARTGG_TOKEN }}
          SMASH_MY_TOURNAMENT_EVENT_ID: ${{ vars.SMASH_MY_TOURNAMENT_EVENT_ID || '1687524' }}
        run: python scripts/database/probe_bracket_response.py
